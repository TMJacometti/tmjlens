# Every pull request compiles and tests both halves on Linux — the same OS the
# image is built on. `--locked` also refuses a Cargo.lock left behind by a
# version bump, the mistake that once produced an unbuildable tag.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        working-directory: src-tauri
        env:
          # The tests open real tmjLite databases through the vendored engine.
          TMJLITE_FFI_PATH: ${{ github.workspace }}/tools/tmjlite/libtmjlite_ffi.so
        run: cargo test --locked

  web:
    name: typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install
        working-directory: src
        run: npm ci
      - name: Unit tests
        working-directory: src
        run: npx vitest run
      - name: Typecheck and build
        working-directory: src
        run: npm run build
