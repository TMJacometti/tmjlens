# Publish the in-cluster image and Helm chart.
# Trigger: git tag web-0.5.1 && git push origin web-0.5.1

name: Publish web

on:
  push:
    tags:
      - "web-*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        name: Version from tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#web-}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be web-<semver>, got ${tag}"
            exit 1
          fi
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/tmjlens" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Package and push Helm chart
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OWNER: ${{ steps.ver.outputs.owner }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm lint charts/tmjlens -f charts/tmjlens/values.example.yaml
          helm package charts/tmjlens --version "$VERSION" --app-version "$VERSION"
          # Flat package name. oci://…/charts/tmjlens is a nested GHCR package;
          # GITHUB_TOKEN gets 403 on that path (and it collides with a leftover PAT push).
          helm push "tmjlens-chart-${VERSION}.tgz" "oci://ghcr.io/${OWNER}"

      - name: Make GHCR packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          accept="Accept: application/vnd.github.package-deletes-preview+json"
          for pkg in tmjlens tmjlens-chart; do
            gh api --method PATCH \
              -H "$accept" \
              "/users/${OWNER}/packages/container/${pkg}" \
              -f visibility=public
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: tmjlens-chart-${{ steps.ver.outputs.version }}.tgz
          name: tmjLens web ${{ steps.ver.outputs.version }}
          body: |
            In-cluster image and Helm chart.

            ```bash
            helm upgrade --install tmjlens oci://ghcr.io/${{ steps.ver.outputs.owner }}/tmjlens-chart \
              --version ${{ steps.ver.outputs.version }} \
              -n tmjlens --create-namespace \
              -f values.install.yaml
            ```

            Chart tarball (no GHCR login):

            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tmjlens-chart-${{ steps.ver.outputs.version }}.tgz
