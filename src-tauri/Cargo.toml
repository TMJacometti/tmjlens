[package]
name = "tmjlens"
version = "0.4.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["clock"] }
kube = { version = "0.96", features = ["client", "config", "rustls-tls", "ws", "runtime"] }
http = "1"
k8s-openapi = { version = "0.23", features = ["v1_30"] }
thiserror = "2"
base64 = "0.22"
flate2 = "1"
futures = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
