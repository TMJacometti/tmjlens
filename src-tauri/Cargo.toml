[package]
name = "tmjlens"
version = "0.5.1"
edition = "2021"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["clock"] }
kube = { version = "0.96", features = ["client", "config", "rustls-tls", "ws", "runtime"] }
http = "1"
k8s-openapi = { version = "0.23", features = ["v1_30"] }
thiserror = "2"
base64 = "0.22"
flate2 = "1"
futures = "0.3"
libloading = "0.8"
