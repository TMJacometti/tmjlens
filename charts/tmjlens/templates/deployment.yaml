{{- if and (hasKey .Values "replicaCount") (ne (int .Values.replicaCount) 1) }}
{{- fail "replicas are fixed at 1: tmjLite and in-memory sessions cannot be shared across pods" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tmjlens.fullname" . }}
  labels:
    {{- include "tmjlens.labels" . | nindent 4 }}
spec:
  # tmjLite is a file on the PVC and sessions live in process memory.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tmjlens.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tmjlens.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tmjlens.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tmjlens
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TMJLENS_ADDR
              value: "0.0.0.0:8080"
            - name: TMJLENS_STATIC_DIR
              value: /app/dist
            - name: TMJLENS_DB_PATH
              value: /var/lib/tmjlens/tmjlens.tmjp
            - name: TMJLENS_ENVIRONMENT
              value: {{ include "tmjlens.environmentType" . | quote }}
            - name: TMJLENS_AUDIT
              value: {{ ternary "on" "off" .Values.environment.logAudit | quote }}
            - name: TMJLENS_CLUSTER_NAME
              value: {{ required "environment.cluster is required" .Values.environment.cluster | quote }}
            - name: TMJLENS_BOOTSTRAP_ADMIN
              value: {{ required "bootstrapAdmin is required" .Values.bootstrapAdmin | trim | lower | quote }}
            - name: TMJLENS_REDIRECT_URL
              value: {{ include "tmjlens.redirectUrl" . | quote }}
            {{- if .Values.collector.enabled }}
            - name: TMJLENS_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tmjlens.fullname" . }}-ingest
                  key: token
            - name: TMJLENS_RETENTION_RAW
              value: {{ .Values.collector.retention.raw | quote }}
            - name: TMJLENS_RETENTION_ROLLUP
              value: {{ .Values.collector.retention.rollup | quote }}
            {{- end }}
            - name: TMJLENS_HPA_MANAGER
              value: {{ ternary "on" "off" .Values.hpaManager.enabled | quote }}
            - name: TMJLENS_HPA_MAX_REPLICAS
              value: {{ .Values.hpaManager.maxReplicasCeiling | quote }}
            - name: TMJLENS_HPA_GITOPS_GUARD
              value: {{ .Values.hpaManager.gitopsGuard | quote }}
            - name: TMJLENS_RESOURCE_EDITOR
              value: {{ ternary "on" "off" .Values.resourceEditor.enabled | quote }}
            - name: TMJLENS_PRICING_PROVIDER
              value: {{ .Values.pricing.provider | quote }}
            {{- if .Values.pricing.instanceType }}
            - name: TMJLENS_PRICE_INSTANCE
              value: {{ .Values.pricing.instanceType | quote }}
            {{- end }}
            {{- if .Values.pricing.region }}
            - name: TMJLENS_PRICE_REGION
              value: {{ .Values.pricing.region | quote }}
            {{- end }}
            {{- if .Values.oidc.issuer }}
            - name: TMJLENS_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: TMJLENS_OIDC_EMAIL_CLAIM
              value: {{ .Values.oidc.emailClaim | quote }}
            - name: TMJLENS_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "tmjlens.oidcSecretName" . }}
                  key: {{ .Values.oidc.existingSecretKeys.clientId }}
            - name: TMJLENS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tmjlens.oidcSecretName" . }}
                  key: {{ .Values.oidc.existingSecretKeys.clientSecret }}
            {{- else }}
            - name: TMJLENS_AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.azure.existingSecret | default (include "tmjlens.fullname" .) }}
                  key: {{ .Values.azure.existingSecretKeys.tenantId }}
            - name: TMJLENS_AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.azure.existingSecret | default (include "tmjlens.fullname" .) }}
                  key: {{ .Values.azure.existingSecretKeys.clientId }}
            - name: TMJLENS_AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.azure.existingSecret | default (include "tmjlens.fullname" .) }}
                  key: {{ .Values.azure.existingSecretKeys.clientSecret }}
            {{- end }}
          # A pod ingesting rollups does real work; the Kubernetes defaults
          # (1s timeout, dead after three misses) turned a busy minute into a
          # restart loop. Liveness waits a full minute of silence before killing.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/tmjlens
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tmjlens.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
