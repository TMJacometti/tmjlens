{{- if .Values.collector.enabled }}
{{- $name := printf "%s-ingest" (include "tmjlens.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.collector.ingestToken }}
{{- if and (not $token) $existing (index $existing.data "token") }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tmjlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
