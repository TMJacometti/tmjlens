apiVersion: v1
kind: Service
metadata:
  name: {{ include "tmjlens.fullname" . }}
  labels:
    {{- include "tmjlens.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # The collector DaemonSet shares the name/instance labels; without the
  # component the Service (and `kubectl port-forward svc/…`) picks collectors.
  selector:
    {{- include "tmjlens.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
