{{- if not .Values.azure.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tmjlens.fullname" . }}
  labels:
    {{- include "tmjlens.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.azure.existingSecretKeys.tenantId }}: {{ required "azure.tenantId is required (or set azure.existingSecret)" .Values.azure.tenantId | quote }}
  {{ .Values.azure.existingSecretKeys.clientId }}: {{ required "azure.clientId is required (or set azure.existingSecret)" .Values.azure.clientId | quote }}
  {{ .Values.azure.existingSecretKeys.clientSecret }}: {{ required "azure.clientSecret is required (or set azure.existingSecret)" .Values.azure.clientSecret | quote }}
{{- end }}
