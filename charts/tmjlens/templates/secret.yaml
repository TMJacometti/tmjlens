{{- if not (or .Values.azure.existingSecret .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tmjlens.fullname" . }}
  labels:
    {{- include "tmjlens.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- if .Values.oidc.issuer }}
  {{ .Values.oidc.existingSecretKeys.clientId }}: {{ required "oidc.clientId is required when oidc.issuer is set (or set oidc.existingSecret)" .Values.oidc.clientId | quote }}
  {{ .Values.oidc.existingSecretKeys.clientSecret }}: {{ required "oidc.clientSecret is required when oidc.issuer is set (or set oidc.existingSecret)" .Values.oidc.clientSecret | quote }}
{{- else }}
  {{ .Values.azure.existingSecretKeys.tenantId }}: {{ required "azure.tenantId is required (or set azure.existingSecret, or oidc.issuer)" .Values.azure.tenantId | quote }}
  {{ .Values.azure.existingSecretKeys.clientId }}: {{ required "azure.clientId is required (or set azure.existingSecret, or oidc.issuer)" .Values.azure.clientId | quote }}
  {{ .Values.azure.existingSecretKeys.clientSecret }}: {{ required "azure.clientSecret is required (or set azure.existingSecret, or oidc.issuer)" .Values.azure.clientSecret | quote }}
{{- end }}
{{- end }}
