# Safe defaults. Copy values.example.yaml to values.install.yaml and fill
# that in — values.install.yaml is gitignored because it holds secrets.
#
# Replicas are fixed at 1 in the Deployment. The tmjLite file and in-memory
# sessions cannot be shared across pods.

image:
  repository: ghcr.io/tmjacometti/tmjlens
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: tmjlens
fullnameOverride: ""

# Shown in the context selector. Set both at install; Settings cannot change them.
environment:
  cluster: ""
  # Must be exactly one of: production | staging | development
  type: production
  # Every action and denial is recorded under the user's own name in the
  # instance database. Off trades the trail for a database that cannot grow.
  logAudit: true

# First SSO login matching this email is granted admin. Case does not matter.
bootstrapAdmin: ""

azure:
  tenantId: ""
  clientId: ""
  clientSecret: ""
  # https://<host>/auth/callback — derived from ingress.host when empty.
  redirectUrl: ""
  existingSecret: ""
  existingSecretKeys:
    tenantId: tenant-id
    clientId: client-id
    clientSecret: client-secret

serviceAccount:
  create: true
  name: ""
  annotations: {}

# The app layer is the security boundary; the SA is what the API server sees.
rbac:
  create: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Generic OIDC (EKS / any issuer). When issuer is set, Azure AD vars are ignored.
oidc:
  issuer: ""
  clientId: ""
  clientSecret: ""
  emailClaim: email
  redirectUrl: ""
  existingSecret: ""
  existingSecretKeys:
    clientId: client-id
    clientSecret: client-secret

collector:
  enabled: true
  interval: 30s
  window: 5m
  ingestToken: ""
  retention:
    raw: 48h
    rollup: 90d
  kubelet:
    # PEM of the kubelet serving CA. Empty uses the pod's cluster CA.
    caFile: ""
    # Kept for the chart API. The scrape always verifies TLS: SNI is the node
    # name, dialed at the Downward API host IP so the hostname on the cert matches.
    insecureSkipVerify: false
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
  tolerations:
    - operator: Exists

hpaManager:
  enabled: false
  maxReplicasCeiling: 50
  gitopsGuard: warn

pricing:
  provider: auto
  instanceType: ""
  region: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
