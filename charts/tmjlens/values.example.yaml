# Copy to values.install.yaml (gitignored) and fill in. Never commit the copy.
#
#   cp charts/tmjlens/values.example.yaml charts/tmjlens/values.install.yaml
#   helm upgrade --install tmjlens charts/tmjlens -n tmjlens --create-namespace \
#     -f charts/tmjlens/values.install.yaml

image:
  repository: ghcr.io/tmjacometti/tmjlens
  tag: "0.6.0"
  pullPolicy: IfNotPresent

environment:
  cluster: prod-shark
  # Must be exactly one of: production | staging | development
  # Settings → Clusters is read-only; this is the only place the label is set.
  type: production
  # false stops writing the audit trail (who did what) to the instance
  # database — for when database growth worries you more than the trail.
  logAudit: true

# Case does not matter — ADMIN@… from the directory still matches.
bootstrapAdmin: admin@tmjsistemas.com.br

azure:
  tenantId: "00000000-0000-0000-0000-000000000000"
  clientId: "00000000-0000-0000-0000-000000000000"
  clientSecret: "replace-me"
  # Leave empty to derive https://<ingress.host>/auth/callback
  redirectUrl: ""

service:
  type: ClusterIP
  port: 80

# Point your Ingress at this Service (name: <release>-tmjlens, port: http).
ingress:
  enabled: true
  className: nginx
  host: tmjlens.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    - secretName: tmjlens-tls
      hosts:
        - tmjlens.example.com

persistence:
  enabled: true
  size: 10Gi
  storageClass: ebs-csi-sc

# Leave empty to use Azure AD (azure.* above). For EKS / Cognito / Keycloak:
# oidc:
#   issuer: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_example
#   clientId: "..."
#   clientSecret: "..."
#   emailClaim: email

collector:
  enabled: true
  kubelet:
    # TLS is always verified. Set collector.kubelet.caFile if the cluster CA
    # is not the kubelet serving CA. insecureSkipVerify is kept for the chart
    # API and does not skip verification.
    insecureSkipVerify: false
  # The collector runs on every node. When a node is out of pod slots it stays
  # Pending there and that node is not measured — the Rightsizing screen names
  # such nodes. "system-node-critical" lets it preempt a lower-priority pod to
  # fit; leave empty to never evict anything.
  priorityClassName: ""

hpaManager:
  enabled: false
  maxReplicasCeiling: 50
  gitopsGuard: warn
